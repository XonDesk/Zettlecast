[project]
name = "zettlecast"
version = "0.1.0"
description = "Local-first Zettelkasten: podcast transcription, semantic search and a knowledge graph (Windows + NVIDIA GPU)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Zettlecast Team"}
]

# Install with torch from the CUDA 13 wheel index:
#   uv pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cu130 --index-strategy unsafe-best-match
dependencies = [
    # API / CLI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "click>=8.1.0",

    # Database
    "lancedb>=0.17.0",
    "pyarrow>=15.0.0,<18.0.0",  # <18 required for NeMo/datasets compatibility

    # GPU models
    "torch>=2.7.0",  # RTX 50-series (sm_120) needs 2.7+; use the cu130 wheels
    "torchaudio>=2.7.0",
    "sentence-transformers>=5.0.0",  # Qwen3-Reranker CrossEncoder support
    # NeMo Speech: Nemotron-3-Diarization needs rope attention, newer than the 3.0.0 PyPI release
    "nemo-toolkit[asr] @ git+https://github.com/NVIDIA-NeMo/Speech@218d0b443441b7d8aa1c832f47df310f186cf0a4",
    "pydub>=0.25.0",

    # Document parsing
    "pypdf>=5.1.0",
    "marker-pdf>=0.3.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "pillow>=10.0.0",

    # Utilities
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
zettlecast = "zettlecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/zettlecast"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
